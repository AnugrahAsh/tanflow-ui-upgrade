<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" preserveAspectRatio="xMidYMid slice" width="1600" height="1600">
  <!-- Flowing banded waves, deep navy into cyan toward the lower right.
       Generated stand-in for the second supplied reference; drop the original
       in as wave-lines.jpg and swap the path to use it verbatim. -->
  <defs>
    <linearGradient id="wbase" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#071A6B"/>
      <stop offset="0.45" stop-color="#0A2AA8"/>
      <stop offset="1" stop-color="#0E63D8"/>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7BE8" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#3FC5F0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6EE8FF" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="wglow" cx="0.72" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#5FE4FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0A2AA8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="wdark" cx="0.35" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#02093A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#02093A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1600" fill="url(#wbase)"/>

  <!-- 30 stacked sine bands. Each is the same curve, shifted down, so the field
       reads as one continuous rippled surface rather than separate lines. -->
  <g fill="none" stroke="url(#stroke)" stroke-linecap="round">
    <g id="bands">
      <path d="M -80 -140 C 260 -240, 500 40, 820 20 S 1360 -180, 1700 -260" stroke-width="17" opacity="0.30"/>
      <path d="M -80 -80  C 260 -180, 500 100, 820 80  S 1360 -120, 1700 -200" stroke-width="17" opacity="0.32"/>
      <path d="M -80 -20  C 260 -120, 500 160, 820 140 S 1360 -60,  1700 -140" stroke-width="17" opacity="0.34"/>
      <path d="M -80 40   C 260 -60,  500 220, 820 200 S 1360 0,    1700 -80"  stroke-width="17" opacity="0.36"/>
      <path d="M -80 100  C 260 0,    500 280, 820 260 S 1360 60,   1700 -20"  stroke-width="17" opacity="0.38"/>
      <path d="M -80 160  C 260 60,   500 340, 820 320 S 1360 120,  1700 40"   stroke-width="17" opacity="0.40"/>
      <path d="M -80 220  C 260 120,  500 400, 820 380 S 1360 180,  1700 100"  stroke-width="17" opacity="0.42"/>
      <path d="M -80 280  C 260 180,  500 460, 820 440 S 1360 240,  1700 160"  stroke-width="17" opacity="0.44"/>
      <path d="M -80 340  C 260 240,  500 520, 820 500 S 1360 300,  1700 220"  stroke-width="17" opacity="0.46"/>
      <path d="M -80 400  C 260 300,  500 580, 820 560 S 1360 360,  1700 280"  stroke-width="17" opacity="0.48"/>
      <path d="M -80 460  C 260 360,  500 640, 820 620 S 1360 420,  1700 340"  stroke-width="17" opacity="0.51"/>
      <path d="M -80 520  C 260 420,  500 700, 820 680 S 1360 480,  1700 400"  stroke-width="17" opacity="0.54"/>
      <path d="M -80 580  C 260 480,  500 760, 820 740 S 1360 540,  1700 460"  stroke-width="17" opacity="0.57"/>
      <path d="M -80 640  C 260 540,  500 820, 820 800 S 1360 600,  1700 520"  stroke-width="17" opacity="0.60"/>
      <path d="M -80 700  C 260 600,  500 880, 820 860 S 1360 660,  1700 580"  stroke-width="17" opacity="0.63"/>
      <path d="M -80 760  C 260 660,  500 940, 820 920 S 1360 720,  1700 640"  stroke-width="17" opacity="0.66"/>
      <path d="M -80 820  C 260 720,  500 1000,820 980 S 1360 780,  1700 700"  stroke-width="17" opacity="0.69"/>
      <path d="M -80 880  C 260 780,  500 1060,820 1040 S 1360 840, 1700 760"  stroke-width="17" opacity="0.72"/>
      <path d="M -80 940  C 260 840,  500 1120,820 1100 S 1360 900, 1700 820"  stroke-width="17" opacity="0.75"/>
      <path d="M -80 1000 C 260 900,  500 1180,820 1160 S 1360 960, 1700 880"  stroke-width="17" opacity="0.78"/>
      <path d="M -80 1060 C 260 960,  500 1240,820 1220 S 1360 1020,1700 940"  stroke-width="17" opacity="0.81"/>
      <path d="M -80 1120 C 260 1020, 500 1300,820 1280 S 1360 1080,1700 1000" stroke-width="17" opacity="0.84"/>
      <path d="M -80 1180 C 260 1080, 500 1360,820 1340 S 1360 1140,1700 1060" stroke-width="17" opacity="0.86"/>
      <path d="M -80 1240 C 260 1140, 500 1420,820 1400 S 1360 1200,1700 1120" stroke-width="17" opacity="0.82"/>
      <path d="M -80 1300 C 260 1200, 500 1480,820 1460 S 1360 1260,1700 1180" stroke-width="17" opacity="0.74"/>
      <path d="M -80 1360 C 260 1260, 500 1540,820 1520 S 1360 1320,1700 1240" stroke-width="17" opacity="0.62"/>
      <path d="M -80 1420 C 260 1320, 500 1600,820 1580 S 1360 1380,1700 1300" stroke-width="17" opacity="0.50"/>
      <path d="M -80 1480 C 260 1380, 500 1660,820 1640 S 1360 1440,1700 1360" stroke-width="17" opacity="0.40"/>
      <path d="M -80 1540 C 260 1440, 500 1720,820 1700 S 1360 1500,1700 1420" stroke-width="17" opacity="0.32"/>
      <path d="M -80 1600 C 260 1500, 500 1780,820 1760 S 1360 1560,1700 1480" stroke-width="17" opacity="0.26"/>
    </g>
  </g>

  <rect width="1600" height="1600" fill="url(#wglow)"/>
  <rect width="1600" height="1600" fill="url(#wdark)"/>
</svg>
